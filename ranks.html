
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>الرتب الملكية | Jura Forest</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
    --leaf: #c2410c;        /* برتقالي شجر خريفي */
    --maple: #ff7a18;       /* برتقالي دافئ */
    --gold: #f5c26a;        /* ذهبي هادي */
    --forest: #14532d;      /* أخضر غامق */
    --deep-wood: #0b1320;   /* كحلي غابة */

    --glow: rgba(255,122,24,0.35);
    --glass: rgba(255,255,255,0.05);
    --border: rgba(255,122,24,0.2);
}

        body {
    font-family: 'Cairo', sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,122,24,0.15), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(20,83,45,0.25), transparent 50%),
        linear-gradient(180deg, #0b1320, #020617);
    color: #f3f4f6;
    min-height: 100vh;
    overflow-x: hidden;
    padding-top: 80px;
}

/* NAV */
.nav-container{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:center;
gap:15px;
padding:15px;
background:rgba(0,0,0,0.75);
backdrop-filter:blur(12px);
border-bottom:1px solid var(--border);
z-index:999;
}

.nav-container {
    background-color: transparent !important;
    background-image: none !important;
    border: none; /* لإزالة أي حدود قد تظهر */
    box-shadow: none; /* لإزالة الظل لو موجود */
}


.epic-menu {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
}

/* الروابط */
.menu-item{
padding:10px 18px;
background:linear-gradient(135deg,var(--orange),var(--orange-soft));
color:#fff;
font-weight:800;
text-decoration:none;
border-radius:999px;
box-shadow:0 0 15px var(--glow);
transition:.3s;
}

.menu-item:hover{
transform:translateY(-3px) scale(1.05);
box-shadow:0 0 25px var(--glow);
}


@keyframes fall {
    0% { transform: translateY(0); }
    100% { transform: translateY(120vh); }
}

.menu-item:hover {
    background: linear-gradient(135deg, #ff7a18, #f5c26a);
    box-shadow: 0 10px 25px rgba(245,194,106,0.4);
}



/* خط سفلي أنيق */
.menu-item::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0%;
    height: 2px;
    background: linear-gradient(90deg, #fceeb5,, #f5d300);
    transition: 0.3s ease;
    border-radius: 10px;
}



.menu-item:hover::after {
    width: 100%;
}

    @media (max-width: 768px) {
    .menu-item {
        padding: 9px 14px;
        font-size: 12px;
    }

    .epic-menu {
        gap: 10px;
    }
}

/* ════════════════════════════════════════
   🍁 LEAVES
   ════════════════════════════════════════ */
.leaf{
    position:fixed;
    top:-60px;
    font-size:20px;
    pointer-events:none;
    z-index:100;
    filter:drop-shadow(0 0 5px rgba(255,120,0,.5));
    animation:fall linear infinite;
}

@keyframes fall{
    0%{transform:translateY(0) rotate(0deg) translateX(0); opacity:1;}
    25%{transform:translateY(25vh) rotate(90deg) translateX(20px);}
    50%{transform:translateY(50vh) rotate(180deg) translateX(-20px);}
    75%{transform:translateY(75vh) rotate(270deg) translateX(15px);}
    100%{transform:translateY(110vh) rotate(360deg) translateX(0); opacity:0;}
}

/* دخول الأنمي للـ nav */
.nav-container {
    animation: navDrop 0.9s ease forwards;
    transform: translateY(-40px);
    opacity: 0;
}

@keyframes navDrop {
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Animation stagger للأزرار */
.menu-item {
    animation: buttonPop 0.6s ease forwards;
    opacity: 0;
    transform: scale(0.8);
}

.menu-item:nth-child(1) { animation-delay: 0.2s; }
.menu-item:nth-child(2) { animation-delay: 0.3s; }
.menu-item:nth-child(3) { animation-delay: 0.4s; }
.menu-item:nth-child(4) { animation-delay: 0.5s; }
.menu-item:nth-child(5) { animation-delay: 0.6s; }
.menu-item:nth-child(6) { animation-delay: 0.7s; }

@keyframes buttonPop {
    to {
        opacity: 1;
        transform: scale(1);
    }
}
    
        


/* HEADER */
.hero{
    text-align:center;
    padding:70px 6% 40px;
    animation:fadeDown 1s ease;
}
.hero h1{
    font-size:2.6rem;
    text-shadow:0 0 15px rgba(245,200,106,.6);
}
.hero p{opacity:.7}

/* GRID */
.princes{
    max-width:1200px;
    margin:auto;
    padding:40px 6%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:35px;
}

/* CARD */
.prince-card{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    background:var(--glass);
    border:1px solid var(--border);
    box-shadow:0 20px 40px rgba(0,0,0,.15);
    animation:rise 1s ease forwards;
    opacity:0;
}

/* صورة الأمير */
.prince-card img{
    width:100%;
    height:260px;
    object-fit:cover;
    filter:brightness(.6);
}

/* overlay */
.prince-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,.85));
}

/* content */
.prince-content{
    position:absolute;
    bottom:20px;
    width:100%;
    text-align:center;
    color:#fff;
}
.prince-name{
    font-size:1.9rem;
    font-weight:900;
}
.symbols{
    margin-top:10px;
    font-size:1.3rem;
}

/* ألوان خاصة */
.obito{box-shadow:0 0 25px rgba(180,0,0,.6)}
.ozuki{box-shadow:0 0 25px rgba(0,80,160,.6)}
.inomaki{box-shadow:0 0 25px rgba(120,0,160,.6)}

footer{
    text-align:center;
    padding:30px;
    font-size:12px;
    opacity:.6;
}

/* ANIMATIONS */
@keyframes fadeDown{
    from{opacity:0;transform:translateY(-40px)}
    to{opacity:1;transform:translateY(0)}
}
@keyframes rise{
    from{opacity:0;transform:translateY(40px)}
    to{opacity:1;transform:translateY(0)}
}
.theme-toggle {
    margin-left: 16px;
    padding: 10px 14px;

    border-radius: 50%;
    border: none;
    cursor: pointer;

    font-size: 16px;
    background: #ffffff;
    color: #0f172a;

    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

.theme-toggle:hover {
    transform: rotate(20deg) scale(1.1);
}

body {

<script>

/* 🍁 LEAVES */
const leafEmojis = ['🍁', '🍂'];
for(let i = 0; i < 25; i++){
    let leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.innerHTML = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
    leaf.style.left = Math.random() * 100 + "%";
    leaf.style.animationDuration = (6 + Math.random() * 8) + "s";
    leaf.style.animationDelay = Math.random() * 10 + "s";
    leaf.style.fontSize = (14 + Math.random() * 16) + "px";
    leaf.style.opacity = (0.4 + Math.random() * 0.6);
    document.body.appendChild(leaf);
}
    
</script>
