<html lang="ar">
<head>

<title>إقليم فرود ☘️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap');

:root {
    /* درجات الأخضر المستوحاة من الإيموجي */
    --leaf-light: #4ade80;    /* أخضر فاتح */
    --leaf-main: #228b22;     /* أخضر غابة - اللون الأساسي */
    --leaf-dark: #064e3b;     /* أخضر داكن جداً */
    --gold-accent: #d4af37;   /* لمسة ذهبية بسيطة للتفاصيل */
    
    /* خلفيات الغابة */
    --bg-main: #022c22;       /* خلفية غامقة جداً مائلة للخضرة */
    --bg-dark: #01120b;
    
    --glow: rgba(74, 222, 128, 0.4); /* توهج أخضر */
    --glass: rgba(255, 255, 255, 0.05);
    --border: rgba(74, 222, 128, 0.2);
}

::selection {
    background-color: var(--leaf-main);
    color: white;
}


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(180deg,var(--bg-main),var(--bg-dark));
    color: #eee;
    min-height: 100vh;
    overflow-x: hidden;
    padding-top: 80px;
}

/* NAV */
.nav-container {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 15px;
  padding: 15px;
  

  background: rgba(255, 204, 0, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 3px solid #000000;
  
  z-index: 999;
}


.nav-container {
    background-color: transparent !important;
    background-image: none !important;
    border: none;
    box-shadow: none; 
}


.epic-menu {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
}


.menu-item {
    padding: 10px 18px;
    /* تدرج من الأخضر الغامق للفاتح */
    background: linear-gradient(135deg, var(--leaf-main), var(--leaf-dark));
    color: #fff; 
    font-weight: 800;
    text-decoration: none;
    border-radius: 999px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3); 
    transition: .3s;
    border: 1px solid var(--leaf-light);
}

/* الخط السفلي عند الهوفير */
.menu-item::after {
    background: linear-gradient(90deg, transparent, #fff, transparent);
}


@keyframes fall {
    0% { transform: translateY(0); }
    100% { transform: translateY(120vh); }
}

.menu-item:hover {
    background: linear-gradient(135deg, var(--leaf-light), var(--leaf-main));
    color: #fff;
    box-shadow: 0 0 20px var(--glow);
    transform: translateY(-3px) scale(1.05);
}





.menu-item::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -4px;
    width: 0%;
    height: 2px;
    background: linear-gradient(90deg, #fceeb5,, #f5d300);
    transition: 0.3s ease;
    border-radius: 10px;
}



.menu-item:hover::after {
    width: 100%;
}

    @media (max-width: 768px) {
    .menu-item {
        padding: 9px 14px;
        font-size: 12px;
    }

    .epic-menu {
        gap: 10px;
    }
}
/* دخول الأنمي للـ nav */
.nav-container {
    animation: navDrop 0.9s ease forwards;
    transform: translateY(-40px);
    opacity: 0;
}

@keyframes navDrop {
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

/* Animation stagger للأزرار */
.menu-item {
    animation: buttonPop 0.6s ease forwards;
    opacity: 0;
    transform: scale(0.8);
}

.menu-item:nth-child(1) { animation-delay: 0.2s; }
.menu-item:nth-child(2) { animation-delay: 0.3s; }
.menu-item:nth-child(3) { animation-delay: 0.4s; }
.menu-item:nth-child(4) { animation-delay: 0.5s; }
.menu-item:nth-child(5) { animation-delay: 0.6s; }
.menu-item:nth-child(6) { animation-delay: 0.7s; }

@keyframes buttonPop {
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* ===== TITLE ===== */
.main-title{
    text-align:center;
    margin:60px auto 40px;
    font-size:32px;
    color:#ddd;
    border-right:5px solid var(--gold);
    padding-right:15px;
    width:fit-content;
}

/* ===== GRID ===== */
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
    padding:0 6% 80px;
}

/* إزالة الخط تحت اللينكات */
.cards a{
    text-decoration:none;
    color:inherit;
}


/* CARD */
.card{
    position:relative;
    height:250px;
    border-radius:20px;
    overflow:hidden;

    background: 
        linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.9)),
    var(--bg) center/cover no-repeat;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    border:1px solid var(--border);
    box-shadow:0 15px 35px rgba(0,0,0,0.6);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px) scale(1.03);
    box-shadow: 0 0 30px rgba(34, 139, 34, 0.3);
    border-color: var(--leaf-light);
}

/* ===== ADMIRAL LABEL ===== */
.rank {
    position: absolute;
    top: 18px;
    right: 18px;

    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 14px;

 
    /* ... (نفس الإعدادات السابقة لـ position و font-size) ... */

    color: #ffffff; /* تغيير الخط للأبيض عشان يبان أفضل مع الأخضر */
    
    /* لون الإطار: أخضر غامق */
    border: 1px solid #2e7d32; 
    border-radius: 200px;

    /* الخلفية: أخضر مع شفافية */
    background: rgba(76, 175, 80, 0.85); 
    
    backdrop-filter: blur(6px);

    /* توهج (Glow) بلون أخضر فاتح */
    box-shadow: 0 0 12px rgba(76, 175, 80, 0.4);

    z-index: 2;
}



/* TEXT */
.card h3{
    font-size:24px;
    color: var(--leaf-light);
    font-weight:900;
}

.icon{
    font-size:26px;
    margin-top:8px;
}

/* ===== SPECIAL ===== */
.mother{
    border:2px solid var(--gold);
    box-shadow:0 0 50px rgba(255,215,0,0.6);
}

.developer-badge {
            position: fixed;
            bottom: 20px;
            left: 20px;
            /* يمكنك تغييرها إلى right إذا أردت */
            background: rgba(15, 23, 42, 0.6);
            /* زجاجي داكن */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 165, 0, 0.2);
            padding: 8px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 9999;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            text-decoration: none;
        }

        .developer-badge:hover {
    transform: translateY(-5px) scale(1.05);
    /* تغيير لون الحدود إلى البرتقالي */
    border-color: #ff4500; 
    /* تغيير لون التوهج إلى البرتقالي مع شفافية 0.2 */
    box-shadow: 0 5px 15px rgba(255, 165, 0, 0.2); 
    background: rgba(15, 23, 42, 0.9);
}


        .developer-badge .text {
            font-family: 'Cinzel', serif;
            /* أو أي خط تفضله */
            font-size: 11px;
            color: #fff;
            letter-spacing: 1.5px;
            font-weight: bold;
        }

        .developer-badge .code-icon {
    color: #ff8c00; /* تم التغيير للبرتقالي */
    font-weight: 900;
    font-family: monospace;
    font-size: 14px;
    animation: blink 2s infinite;
}


        body {
    animation: pageEnter 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes pageEnter {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.97);
        filter: blur(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

/* زر العودة */
.back-btn {
  display: inline-block;
  padding: 12px 20px;
  background: linear-gradient(45deg, var(--leaf-main), var(--leaf-light)); 
  color: white;
  text-decoration: none;
  border-radius: 12px;
  /* ظل أسود خفيف ليعطي طابع التحذير */
  box-shadow: 0 0 15px rgba(0, 0, 0, 0.3); 
  transition: 0.3s;
  font-weight: bold;
}

.back-btn:hover {
  transform: scale(1.1);
  /* عند تمرير الماوس يصبح اللون أغمق قليلاً */
  background: linear-gradient(135deg, #2ecc71, #27ae60);
box-shadow: 0 0 20px #4ade80;
}



/* زر عائم */
.floating-btn {
  position: fixed;
  bottom: 10px;
  right: 6px;
  background: var(--leaf-main); 
  color: white;  
  padding: 6px 10px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  border: 2px solid var(--leaf-light); 
  box-shadow: 0 0 15px var(--glow);
  z-index: 1000;
  transition: 0.3s;
}


.floating-btn:hover {
    transform: scale(1.1);
}

/* FOOTER */
footer{
    text-align:center;
    padding:65px;
    color:#BCAAA4;
}

</style>
